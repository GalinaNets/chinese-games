<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YCT4 Большой тест-повторение</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial, "Helvetica Neue", sans-serif;
  background:linear-gradient(135deg,#e0f2fe,#fff7ed);
  color:#1f2937;
}
.wrap{max-width:1050px;margin:0 auto;padding:18px}
.hero{
  background:white;
  border-radius:26px;
  padding:22px;
  box-shadow:0 12px 35px rgba(0,0,0,.10);
  margin-bottom:16px;
}
h1{margin:0 0 8px;font-size:34px}
.hero p{margin:0;color:#667085;font-size:17px;line-height:1.45}
.layout{display:grid;grid-template-columns:260px 1fr;gap:16px}
.side,.card{
  background:white;
  border-radius:24px;
  box-shadow:0 12px 35px rgba(0,0,0,.09);
}
.side{padding:14px;align-self:start;position:sticky;top:10px}
.card{padding:22px;min-height:560px}
.bar{height:14px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-bottom:12px}
.fill{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#f59e0b);transition:.2s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:#f8fafc;border-radius:16px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.btn{
  border:0;
  border-radius:16px;
  padding:12px 16px;
  cursor:pointer;
  font-weight:700;
  font-size:16px;
}
.primary{background:#2563eb;color:white}
.gray{background:#eef2f7;color:#1f2937}
.green{background:#16a34a;color:white}
.btn:disabled{opacity:.55;cursor:not-allowed}
.nav button{
  display:block;width:100%;text-align:left;margin:6px 0;padding:10px;border-radius:14px;
  border:1px solid #e5e7eb;background:#fff;cursor:pointer;font-weight:700;color:#334155;
}
.nav button.active{background:#dbeafe;border-color:#60a5fa;color:#1d4ed8}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.part{background:#fff7ed;color:#9a3412;border-radius:999px;padding:8px 12px;font-weight:800}
.count{color:#667085;font-weight:700}
.emoji{font-size:56px;margin:10px 0}
.question{font-size:34px;font-weight:800;line-height:1.25;white-space:pre-line;margin:10px 0}
.question.text{font-size:24px;line-height:1.65;background:#f8fafc;border:1px solid #e5e7eb;border-radius:18px;padding:16px}
.hint{font-size:18px;color:#667085;margin-bottom:18px;line-height:1.45}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.opt{
  border:2px solid #e5e7eb;
  background:white;
  border-radius:18px;
  min-height:66px;
  padding:14px;
  cursor:pointer;
  font-size:22px;
  font-weight:800;
}
.opt:hover{background:#eff6ff;border-color:#93c5fd}
.opt.selected{background:#dbeafe;border-color:#2563eb}
.opt.good{background:#dcfce7;border-color:#16a34a;color:#166534}
.opt.bad{background:#fee2e2;border-color:#dc2626;color:#991b1b}
.feedback{display:none;margin-top:16px;border-radius:16px;padding:14px;font-weight:800}
.feedback.good{display:block;background:#dcfce7;color:#166534}
.feedback.bad{display:block;background:#fee2e2;color:#991b1b}
.controls{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.bank,.answer{
  min-height:76px;
  border:2px dashed #cbd5e1;
  border-radius:18px;
  background:#f8fafc;
  padding:12px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin:10px 0 16px;
}
.token{
  background:white;border:2px solid #e5e7eb;border-radius:15px;padding:12px 16px;
  font-size:22px;font-weight:800;cursor:pointer;
}
.answer .token{background:#dbeafe;border-color:#93c5fd}
.token.used{opacity:.35;pointer-events:none}
.input{
  width:180px;font-size:36px;padding:12px;border-radius:16px;border:2px solid #cbd5e1;text-align:center;
}
.result{text-align:center;padding:30px}
.result h2{font-size:42px;margin:0 0 10px}
.mistakes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;text-align:left;margin-top:14px}
.mistake{background:#fff7ed;border:1px solid #fed7aa;border-radius:16px;padding:12px}
@media(max-width:820px){
  .layout{grid-template-columns:1fr}
  .side{position:static}
  .options{grid-template-columns:1fr}
  h1{font-size:28px}
  .question{font-size:28px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>🔁 YCT4 Большой тест-повторение</h1>
    <p>Постепенно: иероглифы → русский перевод → pinyin → аудио → категории → словосочетания → предложения → диалоги → тексты → письмо. Всё кликабельное, без выпадающих блоков.</p>
  </div>
  <div class="layout">
    <aside class="side">
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="stats">
        <div class="stat"><b id="score">0</b><span>баллы</span></div>
        <div class="stat"><b id="done">0</b><span>готово</span></div>
      </div>
      <button class="btn primary" style="width:100%" onclick="restart()">Начать заново</button>
      <div class="nav" id="nav"></div>
    </aside>
    <main class="card" id="card"></main>
  </div>
</div>

<script>
var TASKS = [{"kind": "choice", "part": "1. Иероглиф → русский перевод", "emoji": "🍎", "question": "苹果", "hint": "píngguǒ", "speak": "苹果", "options": ["яблоко", "банан", "виноград", "персик"], "answer": "яблоко"}, {"kind": "choice", "part": "1. Иероглиф → русский перевод", "emoji": "🏥", "question": "医院", "hint": "yīyuàn", "speak": "医院", "options": ["школа", "больница", "магазин", "библиотека"], "answer": "больница"}, {"kind": "choice", "part": "1. Иероглиф → русский перевод", "emoji": "🚇", "question": "地铁", "hint": "dìtiě", "speak": "地铁", "options": ["поезд", "самолёт", "метро", "автобус"], "answer": "метро"}, {"kind": "choice", "part": "1. Иероглиф → русский перевод", "emoji": "😊", "question": "高兴", "hint": "gāoxìng", "speak": "高兴", "options": ["грустный", "радостный", "нервный", "усталый"], "answer": "радостный"}, {"kind": "choice", "part": "1. Иероглиф → русский перевод", "emoji": "🌨️", "question": "下雪", "hint": "xiàxuě", "speak": "下雪", "options": ["идёт снег", "дует ветер", "жарко", "ясно"], "answer": "идёт снег"}, {"kind": "choice", "part": "2. Русский → иероглиф", "emoji": "🥛", "question": "молоко", "hint": "Выбери китайское слово", "speak": "牛奶", "options": ["牛奶", "果汁", "茶", "水"], "answer": "牛奶"}, {"kind": "choice", "part": "2. Русский → иероглиф", "emoji": "📚", "question": "повторять", "hint": "Выбери китайское слово", "speak": "复习", "options": ["学习", "复习", "考试", "成绩"], "answer": "复习"}, {"kind": "choice", "part": "2. Русский → иероглиф", "emoji": "🧊", "question": "холодильник", "hint": "Выбери китайское слово", "speak": "冰箱", "options": ["空调", "冰箱", "电灯", "电脑"], "answer": "冰箱"}, {"kind": "choice", "part": "2. Русский → иероглиф", "emoji": "🐼", "question": "панда", "hint": "Выбери китайское слово", "speak": "熊猫", "options": ["老虎", "猴子", "熊猫", "兔子"], "answer": "熊猫"}, {"kind": "choice", "part": "3. Pinyin → иероглиф", "emoji": "✏️", "question": "qiānbǐ", "hint": "Выбери иероглифы", "speak": "铅笔", "options": ["铅笔", "词典", "作业", "书包"], "answer": "铅笔"}, {"kind": "choice", "part": "3. Pinyin → иероглиф", "emoji": "👓", "question": "yǎnjìng", "hint": "Выбери иероглифы", "speak": "眼镜", "options": ["眼睛", "眼镜", "耳朵", "鼻子"], "answer": "眼镜"}, {"kind": "choice", "part": "3. Pinyin → иероглиф", "emoji": "💊", "question": "gǎnmào", "hint": "Выбери иероглифы", "speak": "感冒", "options": ["感冒", "发烧", "药", "疼"], "answer": "感冒"}, {"kind": "choice", "part": "3. Pinyin → иероглиф", "emoji": "🎹", "question": "tán gāngqín", "hint": "Выбери иероглифы", "speak": "弹钢琴", "options": ["唱歌", "跳舞", "弹钢琴", "打篮球"], "answer": "弹钢琴"}, {"kind": "audio", "part": "4. Аудио → слово", "emoji": "🎧", "question": "Нажми кнопку и выбери слово, которое услышал", "hint": "Озвучка встроенная, работает через браузер", "speak": "天气", "options": ["天气", "学校", "医院", "朋友"], "answer": "天气"}, {"kind": "audio", "part": "4. Аудио → слово", "emoji": "🎧", "question": "Нажми кнопку и выбери слово, которое услышал", "hint": "Озвучка встроенная, работает через браузер", "speak": "作业", "options": ["考试", "作业", "成绩", "词典"], "answer": "作业"}, {"kind": "audio", "part": "4. Аудио → слово", "emoji": "🎧", "question": "Нажми кнопку и выбери слово, которое услышал", "hint": "Озвучка встроенная, работает через браузер", "speak": "自行车", "options": ["公共汽车", "地铁", "自行车", "飞机"], "answer": "自行车"}, {"kind": "multi", "part": "5. Категории", "emoji": "🍜", "question": "Выбери все слова из темы «Еда и напитки»", "hint": "Можно выбрать несколько вариантов, потом нажать «Проверить»", "options": ["苹果", "医院", "面包", "牛奶", "老师", "葡萄"], "answer": ["苹果", "面包", "牛奶", "葡萄"]}, {"kind": "multi", "part": "5. Категории", "emoji": "🚇", "question": "Выбери все слова из темы «Транспорт и город»", "hint": "Можно выбрать несколько вариантов, потом нажать «Проверить»", "options": ["地铁", "飞机", "桌子", "车站", "公园", "眼睛"], "answer": ["地铁", "飞机", "车站", "公园"]}, {"kind": "multi", "part": "5. Категории", "emoji": "🏥", "question": "Выбери все слова из темы «Здоровье и тело»", "hint": "Можно выбрать несколько вариантов, потом нажать «Проверить»", "options": ["感冒", "耳朵", "药", "西瓜", "发烧", "沙发"], "answer": ["感冒", "耳朵", "药", "发烧"]}, {"kind": "order", "part": "6. Собери словосочетание", "emoji": "🧩", "question": "Собери фразу: играть в баскетбол", "hint": "Нажимай слова в правильном порядке", "speak": "打篮球", "words": ["篮球", "打"], "answer": ["打", "篮球"]}, {"kind": "order", "part": "6. Собери словосочетание", "emoji": "🧩", "question": "Собери фразу: смотреть фильм", "hint": "Нажимай слова в правильном порядке", "speak": "看电影", "words": ["电影", "看"], "answer": ["看", "电影"]}, {"kind": "order", "part": "6. Собери словосочетание", "emoji": "🧩", "question": "Собери фразу: ехать на метро", "hint": "Нажимай слова в правильном порядке", "speak": "坐地铁", "words": ["地铁", "坐"], "answer": ["坐", "地铁"]}, {"kind": "order", "part": "7. Собери предложение", "emoji": "🧱", "question": "Собери предложение: Сегодня я очень рад.", "hint": "Нажимай слова по порядку", "speak": "今天我很高兴。", "words": ["高兴", "今天", "我", "很"], "answer": ["今天", "我", "很", "高兴"]}, {"kind": "order", "part": "7. Собери предложение", "emoji": "🧱", "question": "Собери предложение: Вчера я ходил в парк.", "hint": "Нажимай слова по порядку", "speak": "昨天我去公园了。", "words": ["公园", "昨天", "了", "我", "去"], "answer": ["昨天", "我", "去", "公园", "了"]}, {"kind": "order", "part": "7. Собери предложение", "emoji": "🔗", "question": "Собери предложение с 因为…所以…", "hint": "Потому что идёт снег, поэтому мы не идём в парк.", "speak": "因为下雪了，所以我们不去公园。", "words": ["不", "所以", "因为", "去", "我们", "下雪了", "公园"], "answer": ["因为", "下雪了", "所以", "我们", "不", "去", "公园"]}, {"kind": "choice", "part": "8. Вставь слово", "emoji": "🤧", "question": "我今天有点儿不舒服，可能___了。", "hint": "Выбери подходящее слово", "speak": "我今天有点儿不舒服，可能感冒了。", "options": ["感冒", "桌子", "苹果", "地铁"], "answer": "感冒"}, {"kind": "choice", "part": "8. Вставь слово", "emoji": "👓", "question": "他___这个黑色的眼镜很好看。", "hint": "Выбери подходящее слово", "speak": "他戴这个黑色的眼镜很好看。", "options": ["戴", "喝", "踢", "下"], "answer": "戴"}, {"kind": "choice", "part": "8. Вставь слово", "emoji": "📚", "question": "明天考试，今天晚上我要___汉语。", "hint": "Выбери подходящее слово", "speak": "明天考试，今天晚上我要复习汉语。", "options": ["复习", "游泳", "生气", "搬"], "answer": "复习"}, {"kind": "dialog", "part": "9. Мини-диалоги", "emoji": "💬", "question": "A：你怎么还没回家？\nB：我等妈妈开车来接我。\n问：他怎么回家？", "hint": "Выбери правильный ответ", "speak": "我等妈妈开车来接我。", "options": ["走路", "骑车", "坐车", "游泳"], "answer": "坐车"}, {"kind": "dialog", "part": "9. Мини-диалоги", "emoji": "💬", "question": "A：请问，最近的地铁站在哪儿？\nB：你一直向西走，大概五分钟就能看见。\n问：地铁站远吗？", "hint": "Выбери правильный ответ", "speak": "你一直向西走，大概五分钟就能看见。", "options": ["不太远", "很贵", "在医院里", "已经关门了"], "answer": "不太远"}, {"kind": "reading", "part": "10. Мини-текст", "emoji": "📖", "question": "周末，明明和妹妹一起去公园。天气很好，公园里有很多人。妹妹想骑自行车，明明想照相。他们还看见了一只漂亮的蝴蝶。", "hint": "Прочитай текст и ответь на вопрос: 妹妹想做什么？", "speak": "周末，明明和妹妹一起去公园。天气很好，公园里有很多人。妹妹想骑自行车，明明想照相。他们还看见了一只漂亮的蝴蝶。", "options": ["骑自行车", "买衣服", "去医院", "写作业"], "answer": "骑自行车"}, {"kind": "reading", "part": "10. Мини-текст", "emoji": "📖", "question": "小云最近很忙。她每天早上七点起床，坐地铁去学校。下课以后，她要复习汉语，还要练习弹钢琴。虽然有点儿累，但是她觉得很有意思。", "hint": "Прочитай текст и ответь на вопрос: 小云怎么去学校？", "speak": "小云最近很忙。她每天早上七点起床，坐地铁去学校。下课以后，她要复习汉语，还要练习弹钢琴。虽然有点儿累，但是她觉得很有意思。", "options": ["坐地铁", "坐飞机", "骑马", "走路"], "answer": "坐地铁"}, {"kind": "write", "part": "11. Письмо", "emoji": "✍️", "question": "Впиши иероглиф по pinyin: kàn", "hint": "___书 — читать книгу", "speak": "看书", "answer": "看"}, {"kind": "write", "part": "11. Письмо", "emoji": "✍️", "question": "Впиши иероглиф по pinyin: rì", "hint": "节___ — праздник", "speak": "节日", "answer": "日"}, {"kind": "write", "part": "11. Письмо", "emoji": "✍️", "question": "Впиши иероглиф по pinyin: wài", "hint": "___面 — снаружи", "speak": "外面", "answer": "外"}];
var current = 0;
var score = 0;
var answered = [];
var mistakes = [];
var chosenMulti = [];
var order = [];

for (var i=0;i<TASKS.length;i++) answered.push(false);

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g,function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m];
  });
}

function speak(txt){
  try{
    if (!window.speechSynthesis) {
      alert("В этом браузере нет встроенной озвучки.");
      return;
    }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(txt);
    u.lang = "zh-CN";
    u.rate = 0.82;
    u.pitch = 1;
    window.speechSynthesis.speak(u);
  }catch(e){ alert("Озвучка не запустилась в этом браузере."); }
}

function parts(){
  var arr = [];
  for (var i=0;i<TASKS.length;i++) {
    if (arr.indexOf(TASKS[i].part) === -1) arr.push(TASKS[i].part);
  }
  return arr;
}

function renderNav(){
  var p = parts();
  var html = "<hr style='border:0;border-top:1px solid #e5e7eb;margin:14px 0'>";
  for (var i=0;i<p.length;i++) {
    var first = TASKS.findIndex(function(t){return t.part===p[i]});
    var total = TASKS.filter(function(t){return t.part===p[i]}).length;
    var done = TASKS.filter(function(t,idx){return t.part===p[i] && answered[idx]}).length;
    html += "<button class='"+(TASKS[current] && TASKS[current].part===p[i] ? "active":"")+"' onclick='go("+first+")'>"+esc(p[i])+" <span style='float:right'>"+done+"/"+total+"</span></button>";
  }
  document.getElementById("nav").innerHTML = html;
}

function update(){
  var done = answered.filter(Boolean).length;
  document.getElementById("score").textContent = score;
  document.getElementById("done").textContent = done + "/" + TASKS.length;
  document.getElementById("fill").style.width = Math.round(done/TASKS.length*100) + "%";
  renderNav();
}

function topHtml(t){
  return "<div class='top'><span class='part'>"+esc(t.part)+"</span><span class='count'>"+(current+1)+" / "+TASKS.length+"</span></div>";
}

function render(){
  update();
  if (current >= TASKS.length) return results();
  chosenMulti = [];
  order = [];
  var t = TASKS[current];
  var card = document.getElementById("card");
  var qClass = (t.kind==="reading") ? "question text" : "question";
  var audio = t.speak ? "<button class='btn gray' onclick='speak("+JSON.stringify(t.speak)+")'>🔊 Послушать</button>" : "";
  var base = topHtml(t) + "<div class='emoji'>"+esc(t.emoji)+"</div><div class='"+qClass+"'>"+esc(t.question)+"</div><div class='hint'>"+esc(t.hint||"")+"</div><div>"+audio+"</div>";

  if (t.kind==="choice" || t.kind==="audio" || t.kind==="dialog" || t.kind==="reading") {
    var opts = "<div class='options'>";
    for (var i=0;i<t.options.length;i++) {
      opts += "<button class='opt' onclick='answerChoice(this,"+JSON.stringify(t.options[i])+")'>"+esc(t.options[i])+"</button>";
    }
    opts += "</div>";
    card.innerHTML = base + opts + "<div id='fb' class='feedback'></div>" + controls();
  }
  else if (t.kind==="multi") {
    var opts = "<div class='options'>";
    for (var i=0;i<t.options.length;i++) {
      opts += "<button class='opt' onclick='toggleMulti(this,"+JSON.stringify(t.options[i])+")'>"+esc(t.options[i])+"</button>";
    }
    opts += "</div>";
    card.innerHTML = base + opts + "<div class='controls'><button class='btn green' onclick='checkMulti()'>Проверить выбранные</button><button class='btn gray' onclick='render()'>Сбросить</button></div><div id='fb' class='feedback'></div>" + controls();
  }
  else if (t.kind==="order") {
    var bank = "<div><b>Твой ответ:</b></div><div class='answer' id='answer'></div><div><b>Нажимай слова:</b></div><div class='bank'>";
    for (var i=0;i<t.words.length;i++) {
      bank += "<button class='token' onclick='pickWord(this,"+JSON.stringify(t.words[i])+")'>"+esc(t.words[i])+"</button>";
    }
    bank += "</div>";
    card.innerHTML = base + bank + "<div class='controls'><button class='btn green' onclick='checkOrder()'>Проверить порядок</button><button class='btn gray' onclick='render()'>Собрать заново</button></div><div id='fb' class='feedback'></div>" + controls();
  }
  else if (t.kind==="write") {
    card.innerHTML = base + "<p><input class='input' id='input' maxlength='4' placeholder='写'></p><button class='btn green' onclick='checkWrite()'>Проверить</button><div id='fb' class='feedback'></div>" + controls();
    setTimeout(function(){document.getElementById("input").focus()},50);
  }
}

function controls(){
  return "<div class='controls'><button class='btn gray' onclick='prev()'>← Назад</button><button class='btn primary' onclick='next()'>Дальше →</button></div>";
}

function showFb(ok,msg){
  var fb = document.getElementById("fb");
  fb.className = "feedback " + (ok ? "good" : "bad");
  fb.textContent = msg;
}

function mark(ok,user){
  if (!answered[current]) {
    answered[current] = true;
    if (ok) score++;
    else mistakes.push({num:current+1, part:TASKS[current].part, right:Array.isArray(TASKS[current].answer)?TASKS[current].answer.join(", "):TASKS[current].answer, user:user||""});
  }
  update();
}

function answerChoice(btn,val){
  if (answered[current]) return;
  var t = TASKS[current];
  var ok = val === t.answer;
  var buttons = document.querySelectorAll(".opt");
  for (var i=0;i<buttons.length;i++) {
    buttons[i].disabled = true;
    if (buttons[i].textContent === t.answer) buttons[i].classList.add("good");
  }
  if (!ok) btn.classList.add("bad");
  showFb(ok, ok ? "Верно!" : "Не совсем. Правильный ответ: " + t.answer);
  mark(ok,val);
}

function toggleMulti(btn,val){
  if (answered[current]) return;
  btn.classList.toggle("selected");
  var idx = chosenMulti.indexOf(val);
  if (idx >= 0) chosenMulti.splice(idx,1);
  else chosenMulti.push(val);
}

function sameSet(a,b){
  if (a.length !== b.length) return false;
  var aa = a.slice().sort().join("|");
  var bb = b.slice().sort().join("|");
  return aa === bb;
}

function checkMulti(){
  if (answered[current]) return;
  var t = TASKS[current];
  var ok = sameSet(chosenMulti,t.answer);
  var buttons = document.querySelectorAll(".opt");
  for (var i=0;i<buttons.length;i++) {
    buttons[i].disabled = true;
    var val = buttons[i].textContent;
    if (t.answer.indexOf(val)>=0) buttons[i].classList.add("good");
    else if (chosenMulti.indexOf(val)>=0) buttons[i].classList.add("bad");
  }
  showFb(ok, ok ? "Верно! Категория собрана правильно." : "Правильные ответы: " + t.answer.join(", "));
  mark(ok,chosenMulti.join(", "));
}

function pickWord(btn,word){
  if (answered[current]) return;
  order.push(word);
  btn.classList.add("used");
  var a = document.getElementById("answer");
  var tok = document.createElement("button");
  tok.className = "token";
  tok.textContent = word;
  tok.onclick = function(){ render(); };
  a.appendChild(tok);
}

function checkOrder(){
  if (answered[current]) return;
  var t = TASKS[current];
  var ok = sameSet(order,t.answer) && order.join("|") === t.answer.join("|");
  showFb(ok, ok ? "Верно! Фраза собрана правильно." : "Правильно: " + t.answer.join(""));
  mark(ok,order.join(""));
}

function checkWrite(){
  if (answered[current]) return;
  var t = TASKS[current];
  var val = document.getElementById("input").value.trim();
  var ok = val === t.answer;
  showFb(ok, ok ? "Верно!" : "Правильно: " + t.answer);
  mark(ok,val);
}

function next(){
  if (current < TASKS.length-1) { current++; render(); }
  else { current = TASKS.length; results(); }
}

function prev(){
  if (current > 0) { current--; render(); }
}

function go(i){
  current = i;
  render();
}

function restart(){
  current = 0; score = 0; mistakes = [];
  answered = [];
  for (var i=0;i<TASKS.length;i++) answered.push(false);
  render();
}

function results(){
  update();
  var percent = Math.round(score/TASKS.length*100);
  var medal = percent>=90 ? "🥇" : percent>=75 ? "🥈" : percent>=60 ? "🥉" : "🔁";
  var html = "<div class='result'><h2>"+medal+" Результат: "+percent+"%</h2><p>Баллы: "+score+" из "+TASKS.length+"</p><button class='btn primary' onclick='restart()'>Пройти заново</button>";
  html += "<h3>Что повторить</h3><div class='mistakes'>";
  if (mistakes.length===0) html += "<div class='mistake'>Ошибок нет 🎉</div>";
  for (var i=0;i<mistakes.length;i++) {
    html += "<div class='mistake'><b>№"+mistakes[i].num+"</b><br>"+esc(mistakes[i].part)+"<br>Ответ: <b>"+esc(mistakes[i].right)+"</b></div>";
  }
  html += "</div></div>";
  document.getElementById("card").innerHTML = html;
}

render();
</script>
</body>
</html>
