body:before{content:"";position:fixed;inset:0;pointer-events:none;background:rgba(255,255,255,.08);}
.app{max-width:1320px;margin:0 auto;padding:18px;position:relative}
.top{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:16px;position:relative}
.title{
  display:inline-block;padding:14px 54px;border-radius:28px;background:rgba(255,255,255,.9);box-shadow:0 8px 0 rgba(177,111,66,.18),0 16px 35px rgba(0,0,0,.13);
  border:4px solid #fff;font-size:56px;line-height:1;font-weight:900;letter-spacing:5px;text-shadow:0 3px 0 #fff;color:#37a65d;
}
.title span:nth-child(1){color:#ff5e89}.title span:nth-child(2){color:#ff9e25}.title span:nth-child(3){color:#35b9df}.title span:nth-child(4){color:#6bc05e}
.mode{position:absolute;right:0;top:5px;display:flex;background:#fff8ef;border:3px solid #fff;border-radius:25px;box-shadow:0 8px 20px rgba(0,0,0,.12);overflow:hidden}
.mode button{border:0;padding:12px 18px;font-weight:900;font-size:16px;background:transparent;color:#7c5a50;cursor:pointer}
.mode button.active{background:linear-gradient(180deg,#855ff1,#6e4bd3);color:white;border-radius:22px}
.layout{display:grid;grid-template-columns:250px 1fr;gap:18px}
.sidebar{background:rgba(255,255,255,.82);border:4px solid rgba(255,255,255,.8);border-radius:28px;padding:14px;box-shadow:0 16px 35px rgba(0,0,0,.14);align-self:start;max-height:calc(100vh - 115px);overflow:auto}
.badge{background:linear-gradient(180deg,#9d7bff,#7652dc);color:#fff;border-radius:22px;text-align:center;font-size:28px;font-weight:900;padding:12px;margin-bottom:12px;box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
.wordItem{display:grid;grid-template-columns:60px 1fr;gap:10px;align-items:center;margin:8px 0;padding:8px;border-radius:16px;background:#fff8ef;border:2px solid #ead7c2}
.pic{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.pic svg{width:100%;height:100%;filter:drop-shadow(0 2px 1px rgba(0,0,0,.12))}
.wordCn{font-size:24px;font-weight:900;line-height:1}.wordPy{font-size:14px;color:#6e5c57}.wordRu{font-size:13px;color:#7f6e68}
.main{min-width:0}.screen{display:none}.screen.active{display:block}
.menuGrid{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:16px}
.menuCard{min-height:245px;background:rgba(255,255,255,.9);border:5px solid #fff;border-radius:28px;padding:16px;box-shadow:0 14px 28px rgba(0,0,0,.13);cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.menuCard:hover{transform:translateY(-5px) scale(1.02)}
.num{position:absolute;top:12px;left:12px;width:42px;height:42px;border-radius:50%;background:linear-gradient(180deg,#ff8da9,#ff547e);color:white;font-size:24px;font-weight:900;text-align:center;line-height:42px;border:3px solid #fff}
.menuPic{height:115px;margin:18px 0 8px}.menuPic svg{height:100%;width:100%}
.menuTitle{font-size:25px;font-weight:900;text-align:center;color:#1d71b8}.menuDesc{text-align:center;font-size:16px;margin-top:5px}.cardPink{background:linear-gradient(180deg,#ffe4ef,#fff)}.cardBlue{background:linear-gradient(180deg,#dff4ff,#fff)}.cardYellow{background:linear-gradient(180deg,#fff1c5,#fff)}.cardPurple{background:linear-gradient(180deg,#f0dcff,#fff)}.cardGreen{background:linear-gradient(180deg,#e7ffd7,#fff)}.cardOrange{background:linear-gradient(180deg,#ffe6c8,#fff)}
.panel{background:rgba(255,255,255,.88);border:5px solid #fff;border-radius:32px;box-shadow:0 18px 36px rgba(0,0,0,.14);padding:20px;min-height:610px;position:relative;overflow:hidden}
.panel:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 10% 15%,rgba(255,139,177,.15),transparent 22%),radial-gradient(circle at 90% 70%,rgba(113,201,255,.16),transparent 20%);pointer-events:none}
.panel>*{position:relative}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.back{border:0;background:#8c6cff;color:white;border-radius:18px;padding:11px 16px;font-size:18px;font-weight:900;cursor:pointer}.progress{background:#fff4dc;border-radius:20px;padding:9px 16px;font-weight:900}
.stageTitle{text-align:center;font-size:34px;font-weight:900;color:#e9537a;margin-bottom:14px}
.btn{border:0;border-radius:18px;padding:13px 22px;font-size:19px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.15)}.btnBlue{background:#4aa8e8;color:white}.btnGreen{background:#6ccc4d;color:white}.btnRed{background:#ff6464;color:white}.btnOrange{background:#ffae38;color:white}.btnPurple{background:#8f6dff;color:white}
.flashWrap{display:flex;justify-content:center;perspective:1000px}.flash{width:360px;height:405px;position:relative;transform-style:preserve-3d;transition:.55s}.flash.flip{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;background:#fff9ee;border:4px solid #f6d8b5;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 12px 25px rgba(0,0,0,.15)}.face.backFace{transform:rotateY(180deg);background:#f4fff1}.bigPic{width:210px;height:170px}.bigPic svg{width:100%;height:100%}.bigCn{font-size:58px;font-weight:900;margin-top:10px}.bigPy{font-size:28px}.bigRu{font-size:30px;color:#e9537a;font-weight:900}.actions{text-align:center;margin-top:20px}
.options{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin-top:24px}.option{width:180px;min-height:185px;background:white;border:4px solid #fff3e2;border-radius:24px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 10px 22px rgba(0,0,0,.12);cursor:pointer}.option:hover{transform:scale(1.04)}.option.correct{outline:7px solid #78d65e}.option.wrong{animation:shake .35s;outline:7px solid #ff7979}.optPic{width:110px;height:95px}.optPic svg{width:100%;height:100%}.optCn{font-size:30px;font-weight:900}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.buildArea{display:grid;grid-template-columns:260px 1fr;gap:25px;align-items:center}.targetCard{background:#fff8ef;border:4px solid #f4d0a0;border-radius:25px;padding:15px;text-align:center}.slots,.pieces{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.slot,.piece{width:70px;height:70px;border-radius:16px;background:#fff;font-size:42px;font-weight:900;display:flex;align-items:center;justify-content:center;border:3px dashed #dda66c}.piece{border-style:solid;box-shadow:0 6px 0 #edd2b3;cursor:grab}.slot.filled{border-color:#74ce5d;background:#ecffe6}
.pinyinBox{text-align:center}.pinyinQuestion{display:flex;gap:25px;align-items:center;justify-content:center;margin:10px 0 25px}.pinyinCn{font-size:72px;font-weight:900}.pinyinChoices{display:grid;grid-template-columns:repeat(2,220px);gap:14px;justify-content:center}.pinChoice{background:#fff;border:3px solid #efd4b6;border-radius:18px;padding:16px;font-size:26px;font-weight:900;cursor:pointer}.pinChoice.correct{background:#e7ffdd;border-color:#5cc748}.pinChoice.wrong{background:#ffe3e3;border-color:#ff6363}

};
const vocab=[
 {w:'家具',p:'jiā jù',r:'мебель',k:'furniture'}, {w:'沙发',p:'shāfā',r:'диван',k:'沙发'}, {w:'椅子',p:'yǐzi',r:'стул',k:'椅子'}, {w:'沙发椅',p:'shāfā yǐ',r:'кресло',k:'沙发椅'}, {w:'桌子',p:'zhuōzi',r:'стол',k:'桌子'}, {w:'床',p:'chuáng',r:'кровать',k:'床'}, {w:'衣柜',p:'yīguì',r:'шкаф для одежды',k:'衣柜'}, {w:'灯',p:'dēng',r:'лампа',k:'灯'}, {w:'柜子',p:'guìzi',r:'комод',k:'柜子'}, {w:'书架',p:'shūjià',r:'книжная полка',k:'书架'}, {w:'电视机',p:'diànshì jī',r:'телевизор',k:'电视机'}, {w:'镜子',p:'jìngzi',r:'зеркало',k:'镜子'}, {w:'窗户',p:'chuānghu',r:'окно',k:'窗户'}
];
const pinyinWrong={家具:['jiā jǔ','jià jù','jiā qù'],沙发:['shǎfā','shāfǎ','sāfā'],椅子:['yìzi','qǐzi','yǐzì'],沙发椅:['shāfā yì','shǎfā yǐ','shāfǎ yǐ'],桌子:['zhuózi','zuōzi','chuōzi'],床:['chuǎng','chuàng','chuán'],衣柜:['yíguì','yīguī','yìguì'],灯:['dèng','dēn','tēng'],柜子:['guīzi','guìzǐ','kuìzi'],书架:['shūjiā','shùjià','sūjià'],电视机:['diǎnshì jī','diànshí jī','tiànshì jī'],镜子:['jīngzi','jìngzǐ','qìngzi'],窗户:['chuānghu','chuánghu','chuānghū']};
const games=[['Карточки','Учи слова',1,'cardPink','furniture'],['Узнай по звуку','Выбери правильную картинку',2,'cardBlue','灯'],['Собери иероглиф','Перетащи иероглифы по порядку',3,'cardYellow','桌子'],['Выбери пиньинь','Найди правильное произношение',4,'cardPurple','椅子'],['Memory','Найди пары',5,'cardGreen','床'],['Говорение','Говорим целыми фразами',6,'cardOrange','电视机'],['Собери фразу','Поставь мебель по смыслу',7,'cardBlue','灯'],['Моя комната','Создай и опиши комнату',8,'cardPink','沙发']];
function icon(k){return svgs[k]||svgs.furniture}
function el(q){return document.querySelector(q)}
function shuffle(a){return a.sort(()=>Math.random()-.5)}
function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.75;speechSynthesis.speak(u)}
function init(){el('#wordList').innerHTML=vocab.map(x=>`<div class="wordItem"><div class="pic">${icon(x.k)}</div><div><div class="wordCn">${x.w}</div><div class="wordPy">${x.p}</div><div class="wordRu">${x.r}</div></div></div>`).join('');el('#menuGrid').innerHTML=games.map(g=>`<div class="menuCard ${g[3]}" onclick="startGame(${g[2]})"><div class="num">${g[2]}</div><div class="menuPic">${icon(g[4])}</div><div class="menuTitle">${g[2]}. ${g[0]}</div><div class="menuDesc">${g[1]}</div></div>`).join('')}
function showMenu(){el('#game').classList.remove('active');el('#menu').classList.add('active');}
function showGame(){el('#menu').classList.remove('active');el('#game').classList.add('active')}
function startGame(n){showGame(); if(n===1)flash(); if(n===2)sound(); if(n===3)build(); if(n===4)pinyin(); if(n===5)memory(); if(n===6)speaking(); if(n===7)phraseBuild(); if(n===8)roomGame();}
let i=0;
function setProgress(a,b){el('#progress').textContent=`${a} / ${b}`}
function flash(){i=0;drawFlash()}function drawFlash(){const x=vocab[i];setProgress(i+1,vocab.length);el('#gameContent').innerHTML=`<div class="stageTitle">Карточки-перевёртыши</div><div class="flashWrap"><div class="flash" id="flashCard" onclick="this.classList.toggle('flip')"><div class="face"><div class="bigPic">${icon(x.k)}</div><div class="bigCn">${x.w}</div><div class="bigPy">${x.p}</div><button class="btn btnBlue" onclick="event.stopPropagation();speak('${x.w}')">🔊</button></div><div class="face backFace"><div class="bigRu">${x.r}</div><div class="bigPy">${x.p}</div><button class="btn btnBlue" onclick="event.stopPropagation();speak('${x.w}')">🔊 Послушать</button></div></div></div><div class="actions"><button class="btn btnGreen" onclick="nextFlash()">✓ Знаю</button><button class="btn btnRed" onclick="nextFlash()">× Не знаю</button></div>`}
function nextFlash(){i++; if(i>=vocab.length)sound(); else drawFlash()}
function sound(){i=0;drawSound()}function drawSound(){const x=vocab[i], opts=shuffle([x,...shuffle(vocab.filter(v=>v!==x)).slice(0,3)]);setProgress(i+1,vocab.length);el('#gameContent').innerHTML=`<div class="stageTitle">Узнай слово по звуку</div><div style="text-align:center"><button class="btn btnBlue" onclick="speak('${x.w}')">🔊 Послушать</button></div><div class="options">${opts.map(o=>`<div class="option" onclick="checkSound(this,'${o.w}','${x.w}')"><div class="optPic">${icon(o.k)}</div><div class="optCn">${o.w}</div></div>`).join('')}</div>`;setTimeout(()=>speak(x.w),300)}
function checkSound(card,ans,ok){if(ans===ok){card.classList.add('correct');setTimeout(()=>{i++; if(i>=vocab.length)build(); else drawSound()},600)}else card.classList.add('wrong')}
function build(){i=0;drawBuild()}function drawBuild(){const x=vocab[i], chars=x.w.split(''), extra=shuffle([...new Set(vocab.flatMap(v=>v.w.split('')))].filter(c=>!chars.includes(c))).slice(0,3), pieces=shuffle([...chars,...extra]);setProgress(i+1,vocab.length);el('#gameContent').innerHTML=`<div class="stageTitle">Собери иероглиф</div><div class="buildArea"><div class="targetCard"><div class="bigPic">${icon(x.k)}</div><div class="bigRu">${x.r}</div><button class="btn btnBlue" onclick="speak('${x.w}')">🔊</button></div><div><div class="slots">${chars.map((c,idx)=>`<div class="slot" data-expect="${c}" data-idx="${idx}"></div>`).join('')}</div><div class="pieces" style="margin-top:28px">${pieces.map(c=>`<div class="piece" draggable="true" ondragstart="dragChar(event,'${c}')" onclick="tapPiece(this,'${c}')">${c}</div>`).join('')}</div></div></div>`;document.querySelectorAll('.slot').forEach(s=>{s.ondragover=e=>e.preventDefault();s.ondrop=e=>dropChar(e,s)})}
let dragged='';function dragChar(e,c){dragged=c}function dropChar(e,s){if(s.textContent)return;if(dragged===s.dataset.expect){s.textContent=dragged;s.classList.add('filled');checkBuild()}else{s.classList.add('wrong');setTimeout(()=>s.classList.remove('wrong'),300)}}function tapPiece(p,c){const s=[...document.querySelectorAll('.slot')].find(sl=>!sl.textContent&&sl.dataset.expect===c); if(s){s.textContent=c;s.classList.add('filled');p.style.visibility='hidden';checkBuild()}}function checkBuild(){if([...document.querySelectorAll('.slot')].every(s=>s.textContent)){setTimeout(()=>{i++; if(i>=vocab.length)pinyin(); else drawBuild()},650)}}
function pinyin(){i=0;drawPin()}function drawPin(){const x=vocab[i], opts=shuffle([x.p,...pinyinWrong[x.w]]);setProgress(i+1,vocab.length);el('#gameContent').innerHTML=`<div class="stageTitle">Выбери правильный пиньинь</div><div class="pinyinBox"><div class="pinyinQuestion"><div class="bigPic">${icon(x.k)}</div><div class="pinyinCn">${x.w}</div></div><div class="actions" style="margin-bottom:18px"><button class="btn btnBlue" onclick="speak('${x.w}')">🔊 Послушать слово</button></div><div class="pinyinChoices">${opts.map(o=>`<button class="pinChoice" onclick="checkPin(this,'${o}','${x.p}')">${o}</button>`).join('')}</div></div>`}
function checkPin(b,a,o){if(a===o){b.classList.add('correct');setTimeout(()=>{i++; if(i>=vocab.length)memory(); else drawPin()},600)}else b.classList.add('wrong')}
function memory(){const pool=shuffle(vocab).slice(0,8);let cards=shuffle(pool.flatMap((x,idx)=>[{id:idx,type:'pic',x},{id:idx,type:'word',x}]));setProgress(1,1);el('#gameContent').innerHTML=`<div class="stageTitle">Memory — найди пары</div><div class="memoryBoard">${cards.map((c,idx)=>`<div class="mem" data-id="${c.id}" onclick="openMem(this)">${c.type==='pic'?`<div class="pic">${icon(c.x.k)}</div>`:c.x.w}</div>`).join('')}</div><div class="actions"><button class="btn btnOrange" onclick="memory()">Заново</button><button class="btn btnGreen" onclick="speaking()">Дальше</button></div>`}
let first=null,lock=false;function openMem(m){if(lock||m.classList.contains('done')||m.classList.contains('open'))return;m.classList.add('open');if(!first){first=m;return}lock=true;if(first.dataset.id===m.dataset.id){first.classList.add('done');m.classList.add('done');first=null;lock=false}else setTimeout(()=>{first.classList.remove('open');m.classList.remove('open');first=null;lock=false},700)}

const speakPhrases=[
 {cn:'我的房间里有沙发。', py:'Wǒ de fángjiān lǐ yǒu shāfā.', ru:'В моей комнате есть диван.', target:'我的房间里有沙发。'},
 {cn:'我的房间里有床。', py:'Wǒ de fángjiān lǐ yǒu chuáng.', ru:'В моей комнате есть кровать.', target:'我的房间里有床。'},
 {cn:'我的房间里有桌子。', py:'Wǒ de fángjiān lǐ yǒu zhuōzi.', ru:'В моей комнате есть стол.', target:'我的房间里有桌子。'},
 {cn:'我的房间里有椅子。', py:'Wǒ de fángjiān lǐ yǒu yǐzi.', ru:'В моей комнате есть стул.', target:'我的房间里有椅子。'},
 {cn:'我的房间里有书架。', py:'Wǒ de fángjiān lǐ yǒu shūjià.', ru:'В моей комнате есть книжная полка.', target:'我的房间里有书架。'},
 {cn:'我的房间里有衣柜。', py:'Wǒ de fángjiān lǐ yǒu yīguì.', ru:'В моей комнате есть шкаф для одежды.', target:'我的房间里有衣柜。'},
 {cn:'灯在桌子上。', py:'Dēng zài zhuōzi shàng.', ru:'Лампа стоит на столе.', target:'灯在桌子上。'},
 {cn:'电视机在柜子上。', py:'Diànshìjī zài guìzi shàng.', ru:'Телевизор стоит на тумбе / комоде.', target:'电视机在柜子上。'},
 {cn:'镜子在衣柜旁边。', py:'Jìngzi zài yīguì pángbiān.', ru:'Зеркало находится рядом со шкафом.', target:'镜子在衣柜旁边。'},
 {cn:'床在窗户旁边。', py:'Chuáng zài chuānghu pángbiān.', ru:'Кровать находится рядом с окном.', target:'床在窗户旁边。'},
 {cn:'沙发椅在沙发旁边。', py:'Shāfā yǐ zài shāfā pángbiān.', ru:'Кресло находится рядом с диваном.', target:'沙发椅在沙发旁边。'},
 {cn:'椅子在桌子旁边。', py:'Yǐzi zài zhuōzi pángbiān.', ru:'Стул находится рядом со столом.', target:'椅子在桌子旁边。'}
];
let phraseIndex=0;
function speaking(){phraseIndex=0;drawSpeak()}
function drawSpeak(){const total=speakPhrases.length; const x=speakPhrases[phraseIndex]; setProgress(phraseIndex+1,total); el('#gameContent').innerHTML=`<div class="stageTitle">Говорение — целыми фразами</div><div class="phraseTip"><div class="phraseMini"><b>我的房间里有……</b><br><span class="pyHint">wǒ de fángjiān lǐ yǒu</span><br><span class="ruHint">В моей комнате есть…</span></div><div class="phraseMini"><b>在……上</b><br><span class="pyHint">zài ... shàng</span><br><span class="ruHint">на чём-то</span></div><div class="phraseMini"><b>在……旁边</b><br><span class="pyHint">zài ... pángbiān</span><br><span class="ruHint">рядом с чем-то</span></div></div><div class="phraseBox"><div class="phraseCn">${x.cn}</div><div class="phrasePy pyHint">${x.py}</div><div class="phraseRu ruHint">${x.ru}</div></div><div class="actions"><button class="btn btnOrange" onclick="toggleClassDisplay('pyHint')">👀 Пиньинь</button><button class="btn btnOrange" onclick="toggleClassDisplay('ruHint')">👀 Перевод</button><button class="btn btnBlue" onclick="speak('${x.target}')">🔊 Послушать фразу</button><button class="btn btnPurple" onclick="alert('Теперь повтори вслух всю фразу целиком!')">🎙️ Повторить вслух</button><button class="btn btnGreen" onclick="nextSpeak()">Дальше</button></div>`}
function nextSpeak(){phraseIndex++; if(phraseIndex>=speakPhrases.length)phraseBuild(); else drawSpeak()}
function dragon(){const x=shuffle(vocab)[0], chars=shuffle(x.w.split(''));setProgress(1,1);el('#gameContent').innerHTML=`<div class="stageTitle">Dragon Drop</div><div class="dragonBox"><div class="dragon">🐉</div><div class="bigPic" style="margin:auto">${icon(x.k)}</div><p style="font-size:22px;font-weight:900">Собери слово: ${x.r}</p><div class="dragonPieces">${chars.map(c=>`<div class="piece" draggable="true" ondragstart="dragChar(event,'${c}')">${c}</div>`).join('')}</div><div class="basket" ondragover="event.preventDefault()" ondrop="this.textContent+=' '+dragged">Корзина дракона</div><button class="btn btnGreen" onclick="roomGame()">Дальше</button></div>`}


const buildTasks=[
 {cn:'我的房间里有床。', py:'Wǒ de fángjiān lǐ yǒu chuáng.', ru:'В моей комнате есть кровать.', item:'床', base:null, zones:[{ok:true,x:300,y:250,w:180,h:120}]},
 {cn:'我的房间里有沙发。', py:'Wǒ de fángjiān lǐ yǒu shāfā.', ru:'В моей комнате есть диван.', item:'沙发', base:null, zones:[{ok:true,x:300,y:250,w:190,h:120}]},
 {cn:'灯在桌子上。', py:'Dēng zài zhuōzi shàng.', ru:'Лампа на столе.', item:'灯', base:'桌子', baseX:550, baseY:260, zones:[{ok:true,x:555,y:190,w:145,h:95},{ok:false,x:555,y:340,w:145,h:85},{ok:false,x:360,y:250,w:145,h:95}]},
 {cn:'椅子在桌子旁边。', py:'Yǐzi zài zhuōzi pángbiān.', ru:'Стул рядом со столом.', item:'椅子', base:'桌子', baseX:520, baseY:260, zones:[{ok:true,x:360,y:250,w:150,h:115},{ok:false,x:115,y:250,w:150,h:115},{ok:false,x:520,y:150,w:150,h:100}]}
];
let currentBuildTask=0;
function phraseBuild(){currentBuildTask=0;drawPhraseBuild()}
function drawPhraseBuild(){const t=buildTasks[currentBuildTask];const allItems=vocab.filter(v=>v.w!=='家具').slice(0,12);setProgress(currentBuildTask+1,buildTasks.length);const zones=(t.zones||[{ok:true,x:t.x,y:t.y,w:t.w,h:t.h}]).map((z,idx)=>`<div class="zone" data-ok="${z.ok?'1':'0'}" style="left:${z.x}px;top:${z.y}px;width:${z.w}px;height:${z.h}px" ondragover="event.preventDefault()" ondrop="dropTaskItem(event)">Поставь нужный предмет сюда</div>`).join('');el('#gameContent').innerHTML=`<div class="stageTitle">Собери фразу в комнате</div><div class="phraseBox"><div class="phraseCn">${t.cn}</div><div class="phrasePy pyHint hiddenInfo">${t.py}</div><div class="phraseRu ruHint hiddenInfo">${t.ru}</div></div><div class="actions" style="margin-bottom:10px"><button class="btn btnOrange" onclick="toggleClassDisplay('pyHint')">👀 Пиньинь</button><button class="btn btnOrange" onclick="toggleClassDisplay('ruHint')">👀 Перевод</button><button class="btn btnBlue" onclick="speak('${t.cn}')">🔊 Послушать фразу</button><button class="btn btnGreen" onclick="nextPhraseBuild()">Дальше</button></div><div class="taskRoomWrap"><div class="taskList"><b>Мебель:</b><p style="margin:6px 0 10px;font-size:14px">Прочитай фразу и выбери сам, что нужно перетащить.</p><div class="furnButtons">${allItems.map(v=>`<div class="furnBtn" draggable="true" ondragstart="event.dataTransfer.setData('taskItem','${v.k}')" title="${v.w} ${v.p}">${icon(v.k)}</div>`).join('')}</div></div><div class="taskRoom" ondragover="event.preventDefault()" ondrop="dropTaskItem(event)">${t.base?`<div class="placed" style="left:${t.baseX}px;top:${t.baseY}px;pointer-events:none">${icon(t.base)}</div>`:''}${zones}</div></div>`}
function dropTaskItem(e){e.preventDefault();e.stopPropagation();const k=e.dataTransfer.getData('taskItem');const t=buildTasks[currentBuildTask];const z=e.target.closest('.zone');if(!z)return;if(k!==t.item){z.classList.add('wrong');setTimeout(()=>z.classList.remove('wrong'),450);return alert('Нужна другая картинка. Посмотри на фразу!')}if(z.dataset.ok!=='1'){z.classList.add('wrong');setTimeout(()=>z.classList.remove('wrong'),450);return alert('Место не подходит. Прочитай фразу ещё раз!')}document.querySelectorAll('.zone').forEach(q=>{if(q!==z)q.style.opacity='.45'});z.classList.add('ok');z.innerHTML=`<div><div class="placedMini">${icon(k)}</div><div>对！Правильно!</div></div>`;speak(t.cn)}
function nextPhraseBuild(){currentBuildTask++; if(currentBuildTask>=buildTasks.length)roomGame(); else drawPhraseBuild()}
function toggleClassDisplay(cls){document.querySelectorAll('.'+cls).forEach(x=>x.classList.toggle('hiddenInfo'))}

let selectedFurniture=null;
function roomGame(){setProgress(1,1);selectedFurniture=null;el('#gameContent').innerHTML=`<div class="stageTitle">Моя идеальная комната</div><div class="roomGame"><div class="palette"><b>Цвет стен:</b><div class="wallColors">${['#ffe3ef','#dff3ff','#e8ffd9','#fff0bc','#eedfff'].map(c=>`<div class="swatch" style="background:${c}" onclick="document.querySelector('.room').style.background='linear-gradient(${c} 0 55%,#eac58e 56%)'"></div>`).join('')}</div><b>Мебель:</b><p style="margin:6px 0 10px;font-size:14px">Нажми или перетащи предмет в комнату. Потом выдели предмет и меняй его.</p><div class="furnButtons">${vocab.filter(v=>v.w!=='家具').slice(0,12).map(v=>`<div class="furnBtn" draggable="true" onclick="addFurniture('${v.k}')" ondragstart="event.dataTransfer.setData('k','${v.k}')" title="${v.w} ${v.p}">${icon(v.k)}</div>`).join('')}</div></div><div class="roomSide"><div class="room" ondragover="event.preventDefault()" ondrop="dropFurniture(event)"></div><div class="roomControls"><button class="miniBtn" onclick="resizeFurniture(1.15)">➕ Больше</button><button class="miniBtn" onclick="resizeFurniture(0.85)">➖ Меньше</button><button class="miniBtn" onclick="rotateFurniture(-15)">↶ Повернуть</button><button class="miniBtn" onclick="rotateFurniture(15)">↷ Повернуть</button><button class="miniBtn" onclick="deleteSelected()">🗑️ Удалить</button><button class="miniBtn" onclick="document.querySelectorAll('.placed').forEach(x=>x.remove());selectedFurniture=null">Очистить</button></div></div></div>`}
function selectFurniture(d){document.querySelectorAll('.placed').forEach(x=>x.classList.remove('selected'));selectedFurniture=d;d.classList.add('selected')}
function applyTransform(d){d.style.transform=`rotate(${d.dataset.rot||0}deg) scale(${d.dataset.scale||1})`}
function makeMovable(d){d.dataset.scale=d.dataset.scale||1;d.dataset.rot=d.dataset.rot||0;d.onpointerdown=function(e){selectFurniture(d); const room=d.parentElement.getBoundingClientRect(); const startX=e.clientX, startY=e.clientY; const origL=parseFloat(d.style.left)||0, origT=parseFloat(d.style.top)||0; d.setPointerCapture(e.pointerId); d.onpointermove=function(ev){let nl=origL+ev.clientX-startX, nt=origT+ev.clientY-startY; nl=Math.max(-20,Math.min(room.width-40,nl)); nt=Math.max(-20,Math.min(room.height-40,nt)); d.style.left=nl+'px'; d.style.top=nt+'px'}; d.onpointerup=function(){d.onpointermove=null;d.onpointerup=null}; e.preventDefault()}; d.onclick=function(e){selectFurniture(d); e.stopPropagation()}; applyTransform(d)}
function addFurniture(k,x=260,y=230){const room=document.querySelector('.room'); if(!room)return; const d=document.createElement('div'); d.className='placed'; d.innerHTML=icon(k); d.style.left=x+'px'; d.style.top=y+'px'; d.dataset.k=k; room.appendChild(d); makeMovable(d); selectFurniture(d)}
function dropFurniture(e){const k=e.dataTransfer.getData('k'); if(!k)return; const r=e.currentTarget.getBoundingClientRect(); addFurniture(k,e.clientX-r.left-45,e.clientY-r.top-40)}
function resizeFurniture(m){if(!selectedFurniture)return alert('Сначала выбери предмет в комнате.'); selectedFurniture.dataset.scale=Math.max(.45,Math.min(2.4,(parseFloat(selectedFurniture.dataset.scale)||1)*m)); applyTransform(selectedFurniture)}
function rotateFurniture(deg){if(!selectedFurniture)return alert('Сначала выбери предмет в комнате.'); selectedFurniture.dataset.rot=(parseFloat(selectedFurniture.dataset.rot)||0)+deg; applyTransform(selectedFurniture)}
function deleteSelected(){if(!selectedFurniture)return alert('Сначала выбери предмет в комнате.'); selectedFurniture.remove(); selectedFurniture=null}
function toggleWords(){const l=document.querySelector('.layout'); const b=document.querySelector('.hideWords'); if(!l)return; l.classList.toggle('wordsHidden'); b.textContent=l.classList.contains('wordsHidden')?'🙈 Показать слова':'👀 Скрыть слова'}
el('#desktopBtn').onclick=()=>{document.body.classList.remove('mobilePreview');document.body.style.maxWidth='none';document.body.style.margin='0';el('#desktopBtn').classList.add('active');el('#mobileBtn').classList.remove('active')};el('#mobileBtn').onclick=()=>{document.body.classList.add('mobilePreview');document.body.style.maxWidth='430px';document.body.style.margin='0 auto';el('#mobileBtn').classList.add('active');el('#desktopBtn').classList.remove('active')};
init();
</script>
</body>
